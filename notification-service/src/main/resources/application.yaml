server:
  port: ${PORT:8083}
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  application:
    name: notification-service
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:eventhub}
    password: ${RABBITMQ_PASSWORD:eventhub_password}

app:
  messaging:
    rabbitmq:
      exchange: ${RABBITMQ_EXCHANGE:eventhub.business}
      queue: ${RABBITMQ_NOTIFICATION_QUEUE:notification-service.event-registration-created}
      routing-key: ${RABBITMQ_EVENT_REGISTRATION_ROUTING_KEY:event.registration-created.v1}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      group:
        readiness:
          include: readinessState,rabbit
