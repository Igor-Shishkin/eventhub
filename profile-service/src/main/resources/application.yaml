server:
  port: ${PORT:8082}
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  application:
    name: profile-service
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:profile_service}
    username: ${DB_USER:profile_user}
    password: ${DB_PASSWORD:profile_password}
    pool:
      enabled: true
      initial-size: 2
      max-size: 10
      max-idle-time: 10m
  flyway:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:profile_service}
    user: ${DB_USER:profile_user}
    password: ${DB_PASSWORD:profile_password}
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/eventhub}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      group:
        readiness:
          include: readinessState,r2dbc
