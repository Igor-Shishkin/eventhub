services:
  postgres-event:
    image: postgres:16-alpine
    container_name: eventhub-postgres-event
    restart: unless-stopped
    environment:
      POSTGRES_DB: event_service
      POSTGRES_USER: event_user
      POSTGRES_PASSWORD: event_password
    ports:
      - "5432:5432"
    volumes:
      - event_pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U event_user -d event_service"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - eventhub-network

  event-service:
    profiles:
      - apps
    build:
      context: ./event-service
      dockerfile: Dockerfile
    container_name: eventhub-event-service
    ports:
      - "8081:8081"
    environment:
      DB_HOST: postgres-event
    depends_on:
      postgres-event:
        condition: service_healthy
    networks:
      - eventhub-network

  postgres-profile:
    image: postgres:16-alpine
    container_name: eventhub-postgres-profile
    restart: unless-stopped
    environment:
      POSTGRES_DB: profile_service
      POSTGRES_USER: profile_user
      POSTGRES_PASSWORD: profile_password
    ports:
      - "5434:5432"
    volumes:
      - profile_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U profile_user -d profile_service"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - eventhub-network

  profile-service:
    profiles:
      - apps
    build:
      context: ./profile-service
      dockerfile: Dockerfile
    container_name: eventhub-profile-service
    ports:
      - "8082:8082"
    environment:
      DB_HOST: postgres-profile
      DB_PORT: 5432
    depends_on:
      postgres-profile:
        condition: service_healthy
    networks:
      - eventhub-network

  postgres-keycloak:
    image: postgres:16-alpine
    container_name: eventhub-postgres-keycloak
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_password}
    ports:
      - "5433:5432"
    volumes:
      - keycloak_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - eventhub-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.6
    container_name: eventhub-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL_HOST: postgres-keycloak
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_password}
    ports:
      - "8080:8080"
    volumes:
      - ./infrastructure/keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    networks:
      - eventhub-network

networks:
  eventhub-network:
    driver: bridge

volumes:
  event_pgdata:
  profile_pgdata:
  keycloak_pgdata:
