services:
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    container_name: eventhub-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-eventhub}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-eventhub_password}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - eventhub-network

  postgres-event:
    image: postgres:16-alpine
    container_name: eventhub-postgres-event
    restart: unless-stopped
    environment:
      POSTGRES_DB: event_service
      POSTGRES_USER: event_user
      POSTGRES_PASSWORD: event_password
    ports:
      - "5432:5432"
    volumes:
      - event_pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U event_user -d event_service"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - eventhub-network

  notification-service:
    profiles:
      - apps
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: eventhub-notification-service
    ports:
      - "8083:8083"
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-eventhub}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-eventhub_password}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - eventhub-network

  event-service:
    profiles:
      - apps
    build:
      context: ./event-service
      dockerfile: Dockerfile
    container_name: eventhub-event-service
    ports:
      - "8081:8081"
    environment:
      DB_HOST: postgres-event
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-eventhub}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-eventhub_password}
    depends_on:
      postgres-event:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - eventhub-network

networks:
  eventhub-network:
    driver: bridge

volumes:
  event_pgdata:
  rabbitmq_data:


