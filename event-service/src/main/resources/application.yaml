server:
  port: ${PORT:8081}
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  application:
    name: event-service
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:eventhub}
    password: ${RABBITMQ_PASSWORD:eventhub_password}
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:event_service}
    username: ${DB_USER:event_user}
    password: ${DB_PASSWORD:event_password}
    pool:
      enabled: true
      initial-size: 5
      max-size: 20
      max-idle-time: 10m

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      group:
        readiness:
          include: readinessState,r2dbc



app:
  messaging:
    rabbitmq:
      exchange: ${RABBITMQ_EXCHANGE:eventhub.business}
      event-registration-routing-key: ${RABBITMQ_EVENT_REGISTRATION_ROUTING_KEY:event.registration-created.v1}
