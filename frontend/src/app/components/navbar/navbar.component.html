<nav class="navbar">
  <div class="nav-container">
    <a routerLink="/events" class="brand">
      <i class="pi pi-bolt brand-icon"></i>
      <span class="brand-name">EventHub</span>
    </a>

    <div class="nav-links">
      <p-button
        routerLink="/events"
        label="Events"
        icon="pi pi-calendar"
        [text]="true"
        severity="contrast"
        size="small">
      </p-button>

      @if (keycloak.authenticated()) {
        <span class="user-name">{{ keycloak.username() }}</span>

        @if (keycloak.isOrganizer()) {
          <p-button
            routerLink="/events/new"
            label="New Event"
            icon="pi pi-plus"
            severity="primary"
            size="small">
          </p-button>
        }

        <p-button
          label="Logout"
          icon="pi pi-sign-out"
          [text]="true"
          severity="contrast"
          size="small"
          (onClick)="logout()">
        </p-button>
      } @else {
        <p-button
          label="Login"
          icon="pi pi-sign-in"
          severity="primary"
          size="small"
          (onClick)="login()">
        </p-button>
      }
    </div>
  </div>
</nav>
